name: Windows Fork Build

on:
  push:
    branches:
      - master
    tags:
      - '33.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Replay Buffer Tests
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-ci-x64 `
            -DENABLE_REPLAY_BUFFER_TESTS=ON `
            -DENABLE_BROWSER=OFF `
            -DENABLE_SCRIPTING=OFF

      - name: Build and run tests
        shell: pwsh
        run: |
          cmake --build --preset windows-x64 --config RelWithDebInfo --target test_replay_buffer_window
          ctest --test-dir build_x64 -C RelWithDebInfo --output-on-failure -R test_replay_buffer_window

  build:
    name: Windows x64
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build OBS Studio
        uses: ./.github/actions/build-obs
        env:
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
          GPU_PRIORITY_VAL: ${{ secrets.GPU_PRIORITY_VAL }}
        with:
          target: x64
          config: RelWithDebInfo

      - name: Package OBS Studio
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-multi-replay-windows-x64
          path: build_x64/obs-studio-*-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $package = Get-ChildItem build_x64/obs-studio-*-windows-x64.zip |
            Select-Object -First 1
          if (-not $package) {
            throw "No Windows package was produced."
          }

          $notes = @"
          Windows x64 build of the OBS Studio multi-replay-buffer fork.

          This build adds several configurable Replay Buffer durations with one
          hotkey each. See the repository README for setup and testing details.
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $package.FullName --title "OBS Multi-Replay $tag" --notes $notes
          } else {
            gh release upload $tag $package.FullName --clobber
          }
